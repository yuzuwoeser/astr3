name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'yuzuwoeser/astr3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate release tag and ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import { validateCandidate } from "./scripts/release-policy.ts"; import { readFileSync } from "node:fs"; validateCandidate({ tag: process.env.RELEASE_TAG, version: JSON.parse(readFileSync("package.json")).version, commit: "candidate", manifestCommit: "candidate", onMain: true });'
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm exec playwright -- install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:pages
      - run: npm run build:release
      - run: npm run test:starters
      - run: npm run test:release
      - run: npm run test:wordpress
      - run: npm run test:wordpress
        env:
          ASTR3_WP_VERSION: latest
          ASTR3_PHP_VERSION: '8.3'
      - name: Scan history and extracted distributions
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git --log-opts=--all --redact --no-banner .
          for distribution in package browser wordpress starters; do
            "$scanner_dir/gitleaks" dir --redact --no-banner ".release/$distribution"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            .release/*.tgz
            .release/*.zip
            .release/manifest.json
            .release/SHA256SUMS
          include-hidden-files: true
          retention-days: 30
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: .release
      - run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
